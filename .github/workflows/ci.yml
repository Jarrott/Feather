name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift toolchain
        run: swift --version
      - name: Format
        run: swift format lint --strict --recursive Sources Tests Package.swift scripts/create-icon.swift
      - name: Test
        run: swift test
      - name: Build app (CI validation only)
        env:
          CODE_SIGN_IDENTITY: '-'
        run: ./scripts/build-app.sh
      - name: Verify signature and bundle
        run: |
          codesign --verify --strict dist/Feather.app
          plutil -lint dist/Feather.app/Contents/Info.plist
